suite: ref-client
templates:
  - templates/job.yaml
  - templates/deployment.yaml
  - templates/serviceaccount.yaml
tests:
  - it: renders nothing to run by default
    asserts:
      - template: templates/job.yaml
        hasDocuments: {count: 0}
      - template: templates/deployment.yaml
        hasDocuments: {count: 0}
  - it: runs `ref-client demo --env <envName>` as a Job per revision
    template: templates/job.yaml
    release:
      revision: 3
    set:
      job.enabled: true
      envName: eks
    asserts:
      - isKind: {of: Job}
      - equal: {path: metadata.name, value: ref-client-demo-3}
      - equal: {path: "spec.template.spec.containers[0].args", value: [demo, --env, eks]}
      - equal: {path: spec.template.spec.restartPolicy, value: Never}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TOWER_URL, value: "http://tower-mcp:8000/mcp"}
  - it: never hands the DynamoDB Local dummy credentials to the client (Bedrock detection)
    template: templates/job.yaml
    set:
      job.enabled: true
      global.storeEnv: {AWS_ACCESS_KEY_ID: dynamodblocal}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AWS_ACCESS_KEY_ID, value: dynamodblocal}
  - it: optional toolbox Deployment
    template: templates/deployment.yaml
    set:
      deployment.enabled: true
    asserts:
      - equal: {path: "spec.template.spec.containers[0].command", value: [sleep, infinity]}
  - it: IRSA annotation for Bedrock
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.annotations: {eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/att-ref-client}
    asserts:
      - equal: {path: metadata.name, value: ref-client}
