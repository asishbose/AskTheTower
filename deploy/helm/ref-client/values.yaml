# ref-client — the CLI image (ENTRYPOINT ref-client). Bedrock (BEDROCK_MODEL_ID) through IRSA on EKS; with no AWS
# credentials REF_AGENT=auto falls back to the scripted agent.
image:
  registry: ""
  repository: ask-the-tower/ref-client
  tag: ""
  pullPolicy: ""

useStoreEnv: false
envName: local       # `ref-client demo --env <envName>`

env:
  TOWER_URL: http://tower-mcp:8000/mcp
  MOCK_URL: http://mock-carrier:8443
  BINDING_URL: http://binding-page:8081
  REF_AGENT: auto
  REF_ARTIFACTS_DIR: /out
  BEDROCK_MODEL_ID: amazon.nova-micro-v1:0
  AWS_REGION: us-east-1
  HOME: /tmp
secretEnv:
  TOWER_BEARER: {name: "", key: TOWER_BEARER}

# The demo as a Job (named per release revision, so an upgrade runs it again). Transcripts go to stdout and /out.
job:
  enabled: false
  args: []           # default: [demo, --env, <envName>]
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

# Optional long-running toolbox: `kubectl exec deploy/ref-client -- ref-client say "..."`.
deployment:
  enabled: false

serviceAccount:
  create: true
  name: ""
  annotations: {}   # EKS: IRSA role with bedrock:InvokeModel on the one model only

podSecurityContextOverride: {}
resources:
  requests: {cpu: 50m, memory: 160Mi}
  limits: {cpu: 500m, memory: 384Mi}

# Set by the umbrella chart (deploy/helm/umbrella); these defaults make the chart render on its own.
global:
  imageRegistry: ""
  imageTag: ""
  imagePullPolicy: ""
  secretName: att-secrets
  storeEnv: {}
  storeSecretEnv: {}
  nodeSelector: {}

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
